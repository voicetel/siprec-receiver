{{define "header"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .User}}<meta name="csrf-token" content="{{.CSRF}}">{{end}}
<title>siprec-receiver</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; }
  header.top { display: flex; gap: 1rem; align-items: center; padding: .6rem 1rem;
    background: #14213d; color: #fff; }
  header.top a { color: #fca311; text-decoration: none; }
  header.top .spacer { flex: 1; }
  main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ddd; padding: .4rem .5rem; text-align: left;
    vertical-align: top; }
  th { background: #f4f4f4; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 1rem;
    background: #e5e5e5; font-size: .85em; }
  .badge.amd { background: #dbeafe; }
  .badge.completed { background: #dcfce7; }
  .badge.notified { background: #fef9c3; }
  .msg { background: #dcfce7; border: 1px solid #86efac; padding: .5rem .8rem;
    margin-bottom: 1rem; border-radius: .3rem; }
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input, select, button { padding: .4rem; font-size: 1rem; }
  button, .btn { background: #14213d; color: #fff; border: 0; border-radius: .3rem;
    padding: .45rem .9rem; cursor: pointer; text-decoration: none; display: inline-block; }
  button.danger, .btn.danger { background: #b91c1c; }
  audio { width: 320px; max-width: 100%; }
  dl { display: grid; grid-template-columns: 200px 1fr; gap: .3rem .8rem; }
  dt { font-weight: 600; }
  pre { background: #f4f4f4; padding: .8rem; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; }
  .pager { margin-top: 1rem; display: flex; gap: 1rem; }
</style>
</head>
<body>
<header class="top">
  <strong>siprec-receiver</strong>
  <a href="/recordings">Recordings</a>
  <a href="/api/docs">API docs</a>
  {{if .User}}{{if .User.IsAdmin}}<a href="/admin/users">Users</a>
  <a href="/admin/integrations">Integrations</a>
  <a href="/admin/audit">Audit log</a>{{end}}{{end}}
  <span class="spacer"></span>
  {{if .User}}<span>{{.User.Email}} ({{.User.Role}})</span>
  <form method="post" action="/auth/logout" style="display:inline">
    <button type="submit">Sign out</button>
  </form>{{end}}
</header>
<main>
{{if .Msg}}<div class="msg">{{.Msg}}</div>{{end}}
{{end}}

{{define "footer"}}
</main>
</body>
</html>
{{end}}
